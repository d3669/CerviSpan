[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cervispan"
version = "0.1.0"
description = "Official implementation of the CerviSpan CT foundation model"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "SimpleITK>=2.3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["cervispan*"]
